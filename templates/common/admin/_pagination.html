{% if page_obj.paginator.num_pages > 1 %}<nav class="ad-pagination" aria-label="관리 목록 페이지">{% if page_obj.has_previous %}<a class="btn" href="?page={{ page_obj.previous_page_number }}&amp;search={{ search_query|urlencode }}&amp;rank={{ rank_filter|urlencode }}&amp;status={{ status_filter|urlencode }}">이전</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn" href="?page={{ page_obj.next_page_number }}&amp;search={{ search_query|urlencode }}&amp;rank={{ rank_filter|urlencode }}&amp;status={{ status_filter|urlencode }}">다음</a>{% endif %}</nav>{% endif %}
