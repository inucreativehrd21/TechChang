<div class="rk-fields rk-hands">
    <fieldset class="rk-focus"><legend>던지는 손</legend><div class="rk-chips">
        <label class="rk-chip"><input type="radio" name="throwing" value="R" checked required><span>우투</span></label>
        <label class="rk-chip"><input type="radio" name="throwing" value="L"><span>좌투</span></label>
    </div></fieldset>
    <fieldset class="rk-focus"><legend>치는 손</legend><div class="rk-chips">
        <label class="rk-chip"><input type="radio" name="batting" value="R" checked required><span>우타</span></label>
        <label class="rk-chip"><input type="radio" name="batting" value="L"><span>좌타</span></label>
    </div></fieldset>
</div>
<p class="rk-hint">투타 유형은 커리어 동안 유지돼요. 상대 유형에 따른 승부와 숨은 특성에 영향을 줘요.</p>
