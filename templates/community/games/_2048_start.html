<div class="gm">
<div class="gm-wrap">
    <a class="gm-back" href="{% url 'community:games_index' %}"><span aria-hidden="true">←</span> 게임 목록</a>
    <div class="gm-head">
        <div class="gm-head-text">
            <span class="gm-eyebrow">2048 Puzzle</span>
            <h1 class="gm-title">2048</h1>
            <p class="gm-sub">같은 숫자 타일을 합쳐 2048을 만드세요. PC는 방향키, 모바일은 스와이프로 움직입니다.</p>
        </div>
    </div>
    <div class="gm-options">
        <a class="gm-option" href="{% url 'community:game2048_create' %}?difficulty=normal">
            <div class="gm-option-main">
                <div class="gm-option-name">일반</div>
                <p class="gm-option-desc">시간 제한 없이 천천히 생각하며 플레이</p>
            </div>
            <span class="gm-option-go" aria-hidden="true">→</span>
        </a>
        <a class="gm-option" href="{% url 'community:game2048_create' %}?difficulty=hard">
            <div class="gm-option-main">
                <div class="gm-option-name">하드 <span class="gm-pill is-hard">도전</span></div>
                <p class="gm-option-desc">15초 동안 움직이지 않으면 게임 종료</p>
            </div>
            <span class="gm-option-go" aria-hidden="true">→</span>
        </a>
    </div>
    <div class="gm-actions">
        <a class="gm-btn" href="{% url 'community:game2048_leaderboard' %}">리더보드</a>
    </div>
</div>
</div>
