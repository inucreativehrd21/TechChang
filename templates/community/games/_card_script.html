{# 은퇴 카드 페이지 공용 스크립트(라이트·정식 판) — 카드 기울기·빛, 이미지 저장/공유, 링크 공유 #}
<script nonce="{{ csp_nonce }}">
(function () {
    // 카드 — 마우스를 따라 기울고 빛이 비친다(마우스가 있는 화면에서만, 움직임을 줄이는 설정이면 하지 않는다)
    var card = document.querySelector('[data-rl-rcard]');
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (card && !still && window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        card.addEventListener('pointermove', function (e) {
            var r = card.getBoundingClientRect();
            var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
            card.style.setProperty('--ry', ((x - 0.5) * 16).toFixed(2) + 'deg');
            card.style.setProperty('--rx', ((0.5 - y) * 14).toFixed(2) + 'deg');
            card.style.setProperty('--gx', (x * 100).toFixed(1) + '%');
            card.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
            card.classList.add('is-tilting');
        });
        card.addEventListener('pointerleave', function () {
            card.classList.remove('is-tilting');
            card.style.setProperty('--rx', '0deg');
            card.style.setProperty('--ry', '0deg');
        });
    }
    var done = document.querySelector('[data-rl-share-done]');
    var say = function (t) { if (done) { done.textContent = t; done.hidden = false; } };
    // 링크 공유 — 폰은 공유 창, PC 는 링크 복사
    var b = document.querySelector('[data-rl-share]');
    if (b) b.addEventListener('click', function () {
        var url = b.dataset.url;
        if (navigator.share) {
            navigator.share({ title: b.dataset.title, url: url }).catch(function () {});
            return;
        }
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { say('링크를 복사했어요.'); });
    });
    // 이미지 — 파일 공유가 되는 폰이면 공유 창(인스타그램·카카오톡 등)으로, 아니면 내려받기(자바스크립트가 없으면 링크가 내려받는다)
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;   // PC 는 내려받기가 자연스럽다
    var canFiles = touch && !!(navigator.canShare && window.File && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] }));
    document.querySelectorAll('[data-rl-img]').forEach(function (img) {
        var label = img.querySelector('[data-rl-img-label]');
        if (canFiles && img.dataset.shareLabel) label.textContent = img.dataset.shareLabel;   // 피드로 공유 · 스토리로 공유
        img.addEventListener('click', function (e) {
            e.preventDefault();
            if (img.getAttribute('aria-busy') === 'true') return;
            img.setAttribute('aria-busy', 'true');
            var old = label.textContent;
            label.textContent = '카드 그리는 중…';
            fetch(img.dataset.src).then(function (r) {
                if (!r.ok) throw new Error('png ' + r.status);
                return r.blob();
            }).then(function (blob) {
                var file = new File([blob], img.dataset.name, { type: 'image/png' });
                if (canFiles && navigator.canShare({ files: [file] })) return navigator.share({ files: [file] }).catch(function () {});
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = img.dataset.name;
                document.body.appendChild(a);
                a.click();
                setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                say('이미지를 저장했어요.');
            }).catch(function () {
                say('이미지를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');
            }).then(function () {
                label.textContent = old;
                img.removeAttribute('aria-busy');
            });
        });
    });
})();
</script>
