<dialog class="tc-mode-picker" id="tc-mode-picker" aria-labelledby="tc-mode-title" aria-describedby="tc-mode-description" data-game-center="{% url 'community:games_index' %}">
    <div class="tc-mode-surface">
        <header class="tc-mode-head">
            <div><h2 id="tc-mode-title">어떤 야구 인생을 시작할까요?</h2><p id="tc-mode-description">나에게 맞는 모드를 골라 플레이해요.</p></div>
            <button class="tc-mode-close" type="button" data-tc-mode-close aria-label="모드 선택 닫기"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        </header>
        <nav class="tc-mode-list" aria-label="야구선수 키우기 모드">
            <a class="tc-mode-option" href="{% url 'community:rookie_home' %}" data-game-window>
                <span class="tc-mode-icon" aria-hidden="true"><i class="fas fa-calendar-days"></i></span>
                <span class="tc-mode-copy"><b>정식 모드</b><small>로그인하고 매일 조금씩</small><span>칼럼·댓글·출석으로 훈련 포인트를 모아 선수를 키워요.</span></span>
                <i class="fas fa-arrow-right tc-mode-arrow" aria-hidden="true"></i>
            </a>
            <a class="tc-mode-option" href="{% url 'community:lite_home' %}" data-game-window>
                <span class="tc-mode-icon" aria-hidden="true"><i class="fas fa-baseball-bat-ball"></i></span>
                <span class="tc-mode-copy"><b>라이트 모드</b><small>로그인 없이 한 판 약 30분</small><span>훈련과 진로를 골라 고1부터 은퇴까지 한 판으로 즐겨요.</span></span>
                <i class="fas fa-arrow-right tc-mode-arrow" aria-hidden="true"></i>
            </a>
            {% if extreme_public %}<a class="tc-mode-option" href="{% url 'community:extreme_home' %}" data-game-window>
                <span class="tc-mode-icon" aria-hidden="true"><i class="fas fa-bolt"></i></span>
                <span class="tc-mode-copy"><b>익스트림 모드</b><small>로그인 없이 더 빠르게, 더 강하게</small><span>높은 시작 능력과 훈련 효율로 강화된 상대에게 도전해요.</span></span>
                <i class="fas fa-arrow-right tc-mode-arrow" aria-hidden="true"></i>
            </a>{% endif %}
        </nav>
    </div>
</dialog>
