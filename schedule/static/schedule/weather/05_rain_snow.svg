<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<style>
.d1{animation:drop 1.6s ease-in infinite}
.d2{animation:drop 1.6s ease-in .8s infinite}
.s1{animation:snow 2s ease-in-out .3s infinite}
.s2{animation:snow 2s ease-in-out 1.1s infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes snow{0%{transform:translate(0,0);opacity:1}50%{transform:translate(4px,17px)}100%{transform:translate(-3px,34px);opacity:0}}
.sl{fill:none;stroke:#B0D4EE;stroke-width:2.5;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="44" cy="54" r="17" fill="#9EC4E0"/>
<circle cx="62" cy="45" r="20" fill="#9EC4E0"/>
<circle cx="80" cy="52" r="16" fill="#9EC4E0"/>
<rect x="27" y="54" width="69" height="18" rx="5" fill="#9EC4E0"/>
<g class="d1"><ellipse cx="40" cy="80" rx="4" ry="7" fill="#4A8ABE"/></g>
<g class="d2"><ellipse cx="62" cy="80" rx="4" ry="7" fill="#4A8ABE"/></g>
<g class="s1">
<line class="sl" x1="82" y1="77" x2="82" y2="89"/><line class="sl" x1="76" y1="83" x2="88" y2="83"/>
<line class="sl" x1="77.5" y1="78.5" x2="86.5" y2="87.5"/><line class="sl" x1="86.5" y1="78.5" x2="77.5" y2="87.5"/>
</g>
<g class="s2">
<line class="sl" x1="50" y1="77" x2="50" y2="89"/><line class="sl" x1="44" y1="83" x2="56" y2="83"/>
<line class="sl" x1="45.5" y1="78.5" x2="54.5" y2="87.5"/><line class="sl" x1="54.5" y1="78.5" x2="45.5" y2="87.5"/>
</g>
</svg>