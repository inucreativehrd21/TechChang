<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<style>
.ca{animation:da 4s ease-in-out infinite}
.cb{animation:db 4s ease-in-out infinite}
@keyframes da{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
@keyframes db{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="cb" opacity=".65">
<circle cx="60" cy="72" r="15" fill="#B8CCD8"/>
<circle cx="76" cy="64" r="18" fill="#B8CCD8"/>
<circle cx="91" cy="70" r="14" fill="#B8CCD8"/>
<rect x="45" y="70" width="60" height="17" rx="5" fill="#B8CCD8"/>
</g>
<g class="ca">
<circle cx="40" cy="66" r="16" fill="#D4E4EF"/>
<circle cx="57" cy="57" r="20" fill="#D4E4EF"/>
<circle cx="75" cy="63" r="17" fill="#D4E4EF"/>
<rect x="24" y="63" width="68" height="20" rx="5" fill="#D4E4EF"/>
</g>
</svg>