{% load schedule_tags %}{% with it=bar.item %}{% if it.url %}<a href="{{ it.url }}"{% else %}<span{% endif %} class="mc-bar mc-k-{{ it.kind }} mc-c{{ bar.col }} mc-s{{ bar.span }} mc-l{{ bar.lane }}{% if bar.cont_left %} cont-left{% endif %}{% if bar.cont_right %} cont-right{% endif %}" title="{{ it.title }} ({{ it|date_range }})"><span class="visually-hidden">{{ it.kind|kind_label }}, {{ it|date_range }}: </span>{% if it.icon %}<i class="fas {{ it.icon }}" aria-hidden="true"></i>{% endif %}{% if it.start_time and not bar.cont_left %}<span class="mc-time">{{ it.start_time|hm }}</span>{% endif %}<span class="mc-label">{{ it.title }}</span>{% if it.url %}</a>{% else %}</span>{% endif %}{% endwith %}
